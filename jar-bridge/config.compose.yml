server:
  port: 9978
  host: "0.0.0.0"

timeout: 15000
logLevel: INFO

aggregator:
  enabled: true
  baseUrl: "http://aggregator:5678"
  tokenEnv: "AGGREGATOR_TOKEN"
  syncInterval: "PT15M"
  connectTimeout: 5000
  readTimeout: 15000
  maxResponseBytes: 10485760

catalog:
  mode: "hybrid"
  snapshotRetention: 2
  retirementGraceMs: 30000
  allowEmpty: false

artifacts:
  maxJarBytes: 104857600
  cacheMaxBytes: 2147483648
  downloadConcurrency: 4
  maxZipEntries: 50000

security:
  secretKeyEnv: "BRIDGE_SECRET_KEY"
  allowedPrivateHosts:
    - "aggregator"
  allowedPrivateCidrs: []

admin:
  enabled: false
  tokenEnv: "BRIDGE_ADMIN_TOKEN"

plugins: []
