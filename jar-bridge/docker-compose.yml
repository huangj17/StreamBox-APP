services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:9978:9978"
    environment:
      # 容器内必须监听全部接口，宿主机仍只暴露到 127.0.0.1。
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PUBLIC_BASE_URL: "http://127.0.0.1:9978"
    volumes:
      - ./plugins:/app/plugins:ro
      - ./config.yml:/app/config.yml:ro
      - gateway-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 2.0
    init: true
    restart: unless-stopped

volumes:
  gateway-data:
