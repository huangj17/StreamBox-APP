openapi: 3.0.3
info:
  title: StreamBox Gateway API
  version: 2.0.0
  description: |
    StreamBox Gateway 将本地配置的 Spider JAR 暴露为苹果 CMS 兼容 API。
    Gateway 是可选组件；Flutter 客户端也可以直接连接普通 CMS 源。
servers:
  - url: http://localhost:9978
security:
  - bearerAuth: []
tags:
  - name: Gateway
  - name: Content
paths:
  /health/live:
    get:
      security: []
      tags: [Gateway]
      summary: 不暴露内部信息的存活检查
      responses:
        "200": {description: Gateway 进程存活}
  /api/list:
    get:
      tags: [Gateway]
      summary: 发现公开且可用的 Gateway 片源
      responses:
        "200":
          description: 手工配置的可用片源目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /health:
    get:
      tags: [Gateway]
      summary: Gateway、目录与手工插件健康状态
      responses:
        "200":
          description: 至少存在一个公开片源
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 公开片源目录为空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/{key}:
    get:
      tags: [Content]
      summary: JAR 片源内容接口
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: ac, in: query, schema: {type: string, enum: [class, detail]}}
        - {name: ids, in: query, schema: {type: string}}
        - {name: t, in: query, schema: {type: string}}
        - {name: pg, in: query, schema: {type: string, default: "1"}}
        - {name: wd, in: query, schema: {type: string}}
      responses:
        "200":
          description: 苹果 CMS 兼容 JSON
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {description: BAD_QUERY}
        "404": {description: SOURCE_NOT_FOUND}
        "502": {description: 插件返回非法 JSON}
        "503": {description: SOURCE_UNAVAILABLE}
        "504": {description: Spider 调用超时}
  /api/{key}/play:
    get:
      tags: [Content]
      summary: JAR playerContent 播放地址解析
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: flag, in: query, schema: {type: string}}
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: 可直接播放结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayResponse"
        "400": {description: BAD_QUERY 或 PLAY_RESOLUTION_UNSUPPORTED}
        "404": {description: SOURCE_NOT_FOUND}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Source:
      type: object
      required: [key, name, api, kind, status, searchable]
      properties:
        key: {type: string, example: jianpian}
        name: {type: string, example: 荐片视频}
        api: {type: string, example: /api/jianpian}
        kind: {type: string, enum: [manual]}
        status: {type: string, enum: [ready, degraded]}
        searchable: {type: boolean}
    ListResponse:
      type: object
      required: [code, catalogVersion, stale, sources]
      properties:
        code: {type: integer, example: 200}
        catalogVersion: {type: string, example: manual-1786089600000}
        stale:
          type: boolean
          description: 兼容保留字段，手工模式固定为 false
          example: false
        sources:
          type: array
          items: {$ref: "#/components/schemas/Source"}
    HealthResponse:
      type: object
      required: [status, version, uptime, catalog, plugins]
      properties:
        status: {type: string, enum: [ok, error]}
        version: {type: string, example: 2.0.0}
        uptime: {type: string}
        catalog: {type: object, additionalProperties: true}
        plugins: {type: object, additionalProperties: true}
    PlayResponse:
      type: object
      required: [parse, url, header]
      properties:
        parse: {type: integer, enum: [0]}
        url: {type: string}
        header:
          type: object
          additionalProperties: {type: string}
    ErrorResponse:
      type: object
      required: [code, error, message, requestId]
      properties:
        code: {type: integer}
        error: {type: string}
        message: {type: string}
        requestId: {type: string}
