name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: client

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            # Release APKs are never signed with a throwaway debug key: an APK whose
            # certificate changes between releases cannot be installed over the
            # previous one. Skip the job instead, so macOS/Windows still publish.
            echo "::warning::Android release signing secrets missing:$missing — skipping APK build. See CONTRIBUTING.md#android-发布签名"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: steps.signing.outputs.configured == 'true'
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.signing.outputs.configured == 'true'
      - name: Configure Android release signing
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/streambox-release.jks"
      - name: Build signed APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/streambox-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Verify signing certificate
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          "$APKSIGNER" verify "$APK"
          ACTUAL_CERT="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
      - name: Rename artifact
        if: steps.signing.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        run: mv client/build/app/outputs/flutter-apk/app-release.apk StreamBox-${{ github.ref_name }}-android.apk
      - uses: softprops/action-gh-release@v2
        if: steps.signing.outputs.configured == 'true'
        with:
          files: StreamBox-${{ github.ref_name }}-android.apk

  macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip .app
        working-directory: ${{ github.workspace }}
        run: |
          cd client/build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/StreamBox-${{ github.ref_name }}-macos.zip" *.app
      - uses: softprops/action-gh-release@v2
        with:
          files: StreamBox-${{ github.ref_name }}-macos.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Release dir
        working-directory: ${{ github.workspace }}
        run: Compress-Archive -Path client/build/windows/x64/runner/Release/* -DestinationPath StreamBox-${{ github.ref_name }}-windows.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: StreamBox-${{ github.ref_name }}-windows.zip
