name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要补构建并上传的已有 tag（如 v0.3.0）'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: client

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check Android signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            # Release APKs are never signed with a throwaway debug key: an APK whose
            # certificate changes between releases cannot be installed over the
            # previous one. Skip the job instead, so macOS/Windows still publish.
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              # A manual run exists only to produce the APK, so silence is wrong here.
              echo "::error::Android release signing secrets missing:$missing — see CONTRIBUTING.md#android-发布签名" >&2
              exit 1
            fi
            echo "::warning::Android release signing secrets missing:$missing — skipping APK build. See CONTRIBUTING.md#android-发布签名"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: steps.signing.outputs.configured == 'true'
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.signing.outputs.configured == 'true'
      - name: Configure Android release signing
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/streambox-release.jks"
      - name: Build signed APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/streambox-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Verify signing certificate
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          # `verify --print-certs` verifies and dumps the signer in one pass; the
          # dump is public information, so log it to make failures diagnosable.
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          # The signer is labelled "Signer #1 ..." or, when the APK carries only
          # the v2/v3 schemes, "Signer (minSdkVersion=..., maxSdkVersion=...) #1
          # ...", so key off the digest itself rather than the line prefix.
          ACTUAL_CERT="$(sed -n 's/.*certificate SHA-256 digest: *//p' signer.txt \
            | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          # The secret is pasted by hand, so accept whatever keytool/apksigner
          # printed around it: a `SHA-256:` label, colon separators, line wraps.
          EXPECTED_CERT="$(printf '%s' "$ANDROID_CERT_SHA256" \
            | grep -oiE '([0-9a-f]{2}:){31}[0-9a-f]{2}|[0-9a-f]{64}' \
            | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL_CERT" ]; then
            echo "::error::Could not read the signer certificate from the APK" >&2
            exit 1
          fi
          if [ -z "$EXPECTED_CERT" ]; then
            echo "::error::ANDROID_CERT_SHA256 holds no SHA-256 digest. APK signed by: $ACTUAL_CERT" >&2
            exit 1
          fi
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Signing certificate mismatch. APK signed by: $ACTUAL_CERT" >&2
            exit 1
          fi
      - name: Rename artifact
        if: steps.signing.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        run: mv client/build/app/outputs/flutter-apk/app-release.apk StreamBox-${{ inputs.tag || github.ref_name }}-android.apk
      - name: Upload APK to release
        if: steps.signing.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "StreamBox-$TAG-android.apk" --clobber

  macos:
    name: macOS App
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip .app
        working-directory: ${{ github.workspace }}
        run: |
          cd client/build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/StreamBox-${{ github.ref_name }}-macos.zip" *.app
      - uses: softprops/action-gh-release@v3
        with:
          files: StreamBox-${{ github.ref_name }}-macos.zip

  windows:
    name: Windows
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Release dir
        working-directory: ${{ github.workspace }}
        run: Compress-Archive -Path client/build/windows/x64/runner/Release/* -DestinationPath StreamBox-${{ github.ref_name }}-windows.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v3
        with:
          files: StreamBox-${{ github.ref_name }}-windows.zip
